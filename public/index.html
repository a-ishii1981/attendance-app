<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>出退勤管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0c29; }
    #loading {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
      color: #f0eeff; font-family: 'Noto Sans JP', sans-serif;
    }
    #loading .icon { font-size: 40px; margin-bottom: 16px; }
    #loading .msg  { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    #loading .sub  { font-size: 12px; color: #9b8fff; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="icon">🔄</div>
    <div class="msg">読み込み中...</div>
    <div class="sub">アプリを初期化しています</div>
  </div>
  <div id="login-screen" style="display:none; min-height:100vh; background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%); flex-direction:column; align-items:center; justify-content:center; padding:24px; font-family:'Noto Sans JP',sans-serif; color:#f0eeff; box-sizing:border-box;">
    <div style="width:100%; max-width:380px;">
      <div style="text-align:center; margin-bottom:36px;">
        <div style="font-size:48px; margin-bottom:14px;">⏱️</div>
        <div style="font-size:26px; font-weight:800; letter-spacing:-0.5px; margin-bottom:6px;">出退勤管理</div>
        <div style="font-size:12px; color:#9b8fff; letter-spacing:3px;">ATTENDANCE MANAGER</div>
      </div>
      <div style="background:rgba(255,255,255,0.06); border:1px solid rgba(138,101,255,0.35); border-radius:24px; padding:32px 28px;">
        <div id="login-error" style="display:none; background:rgba(248,113,113,0.15); border:1px solid rgba(248,113,113,0.4); color:#f87171; border-radius:12px; padding:12px 16px; font-size:14px; margin-bottom:20px; line-height:1.5;"></div>
        <div style="margin-bottom:18px;">
          <div style="font-size:12px; color:#9b8fff; margin-bottom:8px; letter-spacing:1px;">ユーザーID</div>
          <input id="login-id" type="text" autocomplete="username" inputmode="text" placeholder="IDを入力してください" style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(138,101,255,0.35); border-radius:12px; padding:14px 16px; color:#fff; font-size:16px; box-sizing:border-box; outline:none; font-family:'Noto Sans JP',sans-serif;" />
        </div>
        <div style="margin-bottom:22px;">
          <div style="font-size:12px; color:#9b8fff; margin-bottom:8px; letter-spacing:1px;">パスワード</div>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="パスワードを入力してください" style="width:100%; background:rgba(255,255,255,0.08); border:1px solid rgba(138,101,255,0.35); border-radius:12px; padding:14px 16px; color:#fff; font-size:16px; box-sizing:border-box; outline:none; font-family:'Noto Sans JP',sans-serif;" />
        </div>
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:26px; user-select:none;">
          <input id="login-remember" type="checkbox" style="width:18px; height:18px; cursor:pointer; accent-color:#8a65ff; flex-shrink:0;" />
          <span style="font-size:14px; color:#c4b5ff;">ログイン状態を保持する（30日間）</span>
        </label>
        <button id="login-btn" style="width:100%; background:linear-gradient(135deg,rgba(138,101,255,0.9) 0%,rgba(99,69,200,0.95) 100%); border:none; color:#fff; border-radius:14px; padding:16px; font-size:16px; font-weight:700; cursor:pointer; font-family:'Noto Sans JP',sans-serif; letter-spacing:0.5px;">ログイン</button>
      </div>
    </div>
  </div>
  <div id="root"></div>

  <script>
    // ── サーバーAPIを使ったストレージ実装 ──────────────────
    window.storage = {
      async get(key) {
        try {
          const res = await fetch("/api/storage/" + encodeURIComponent(key));
          const json = await res.json();
          return { value: json.value };
        } catch { return { value: null }; }
      },
      async set(key, value) {
        try {
          await fetch("/api/storage/" + encodeURIComponent(key), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ value })
          });
        } catch {}
      }
    };
  </script>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ─── 永続ストレージ ────────────────────────────────────────
    const D_KEY  = "attendance_data_v2";
    const E_KEY  = "events_v1";
    const W_KEY  = "wage_settings_v1";
    const R_KEY  = "report_data_v1";
    const RT_KEY = "route_master_v1";
    const U_KEY  = "username_v1";

    async function storageSave(k, v) {
      try { await window.storage.set(k, JSON.stringify(v)); } catch {}
      try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
    }
    async function storageLoad(k, fb) {
      try { const r = await window.storage.get(k); if (r?.value != null) return JSON.parse(r.value) ?? fb; } catch {}
      try { return JSON.parse(localStorage.getItem(k) || "null") ?? fb; } catch { return fb; }
    }

    // ─── データ検証・サニタイズ ────────────────────────────────
    function isValidDataKey(k) {
      const dp = k.includes("_") ? k.split("_").slice(1).join("_") : k;
      return /^\d{4}-\d{2}-\d{2}$/.test(dp);
    }
    function sanitizeData(raw) {
      if (!raw || typeof raw !== "object") return {};
      return Object.fromEntries(Object.entries(raw).filter(([k]) => isValidDataKey(k)));
    }

    // ─── ヘルパー ──────────────────────────────────────────────
    const pad = n => String(n).padStart(2, "0");
    function localDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    const fmtTime = iso => { if (!iso) return "--:--"; const d = new Date(iso); return isNaN(d.getTime()) ? "--:--" : `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const fmtMin  = m => (!m || m < 0) ? "0h 0m" : `${Math.floor(m/60)}h ${Math.round(m%60)}m`;
    const fmtDate = s => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return s||""; const d = new Date(s+"T00:00:00"); return isNaN(d.getTime()) ? s : d.toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"}); };
    const fmtYen  = n => `¥${Math.round(n).toLocaleString("ja-JP")}`;
    const toDecH  = m => (m/60).toFixed(2).replace(/\.?0+$/,"")+"h";

    function calcWork(rec) {
      if (!rec?.clockIn || !rec?.clockOut) return 0;
      const ci = new Date(rec.clockIn), co = new Date(rec.clockOut);
      if (isNaN(ci.getTime())||isNaN(co.getTime())) return 0;
      const raw = (co-ci)/60000;
      const brk = (rec.breaks||[]).reduce((s,b)=>{ const bs=new Date(b.start),be=new Date(b.end); return (b.start&&b.end&&!isNaN(bs)&&!isNaN(be))?s+(be-bs)/60000:s; },0);
      return Math.max(0, raw-brk);
    }
    function calcWage(workMin, wage) {
      const { baseHourly=1400, thresholdHours=8, overtimeRate=1.25 } = wage||{};
      const wh = workMin/60, nh = Math.min(wh,thresholdHours), oh = Math.max(0,wh-thresholdHours);
      return { normal:nh*baseHourly, overtime:oh*baseHourly*overtimeRate, total:nh*baseHourly+oh*baseHourly*overtimeRate, overHours:oh, normalHours:nh };
    }
    function fmtJapanDate(start, end) {
      if (!start) return '';
      const s = new Date(start + 'T00:00:00');
      const e = end ? new Date(end + 'T00:00:00') : null;
      const y = s.getFullYear();
      const sm = s.getMonth() + 1;
      const sd = s.getDate();
      if (!e) return y + '年' + sm + '月' + sd + '日';
      if (s.getFullYear() === e.getFullYear() && s.getMonth() === e.getMonth()) {
        return y + '年' + sm + '月' + sd + '日〜' + e.getDate() + '日';
      }
      return y + '年' + sm + '月' + sd + '日〜' + (e.getMonth() + 1) + '月' + e.getDate() + '日';
}
    function buildISO(dateStr, timeStr) {
      if (!dateStr||!timeStr||!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)||!/^\d{2}:\d{2}$/.test(timeStr)) return null;
      const d = new Date(`${dateStr}T${timeStr}:00`); return isNaN(d.getTime()) ? null : d.toISOString();
        }    // ─── 報告テキスト生成 ──────────────────────────────────────
    function generateReportText({ ev, userName, evRecs, wage, expense }) {
      if (!ev) return "";
      const sorted = [...evRecs].sort(([a],[b])=>a>b?1:-1);
      const ym = ev.start ? ev.start.slice(0,7).replace("-","") : "";
      let lines = [`${ym} ${ev.store ? ev.store+"\u3000" : ""}${ev.name}`, userName||"", `シフト時間（休憩時間）　実働時間`];
      let totalMin = 0;
      for (const [key,rec] of sorted) {
        const dp = key.includes("_")?key.split("_")[1]:key;
        const d = new Date(dp+"T00:00:00");
        const md = `${d.getMonth()+1}/${d.getDate()}`;
        const wm = calcWork(rec); totalMin += wm;
        const brkMin = (rec.breaks||[]).reduce((s,b)=>b.start&&b.end?s+(new Date(b.end)-new Date(b.start))/60000:s,0);
        lines.push(`${md}　${fmtTime(rec.clockIn)}-${fmtTime(rec.clockOut)}（${brkMin>0?`${Math.round(brkMin)}分休憩`:"休憩なし"}）- ${toDecH(wm)}`);
      }
      lines.push(``, `合計実働　${toDecH(totalMin)}`, ``);
      const wageTotal=evRecs.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).total,0);
      const normalMin=evRecs.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).normalHours*60,0);
      const overMin=evRecs.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).overHours*60,0);
      const nH=normalMin/60, oH=overMin/60;
      const { baseHourly=1400, overtimeRate=1.25 } = wage||{};
      lines.push(`${nH%1===0?nH:nH.toFixed(2)}h × ${baseHourly}円 = ${Math.round(evRecs.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).normal,0)).toLocaleString()}円`);
      if (overMin>0) lines.push(`${oH%1===0?oH:oH.toFixed(2)}h × ${baseHourly}円 × ${overtimeRate} = ${Math.round(evRecs.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).overtime,0)).toLocaleString()}円`);
      lines.push(`■TOTAL　${Math.round(wageTotal).toLocaleString()}円`, ``);
      const tr=expense.transport||[], tt=tr.reduce((s,t)=>s+(parseInt(t.amount)||0)*(parseInt(t.count)||1),0);
      lines.push(`■交通費　${tt.toLocaleString()}`);
      tr.forEach(t=>{
        const lbl = (t.from||t.to) ? `${t.from||""}→${t.to||""}` : (t.label||"");
        if(!lbl && !t.amount) return;
        const cnt = parseInt(t.count)||1;
        const amt = parseInt(t.amount)||0;
        if(cnt>1) lines.push(`${lbl}　${amt}×${cnt}＝${(amt*cnt).toLocaleString()}`);
        else lines.push(`${lbl}　${amt}`);
      });
      lines.push(``);
      const bathCnt = parseInt(expense.bathCount)||1;
      const bathAmt = parseInt(expense.bath||0);
      const bathTotalAmt = bathAmt * bathCnt;
      if(bathCnt>1) lines.push(`■銭湯代　${bathAmt}×${bathCnt}＝${bathTotalAmt.toLocaleString()}`, ``);
      else lines.push(`■銭湯代　${bathTotalAmt.toLocaleString()}`, ``);
      const supItems = expense.suppliesItems||[];
      const supTotal = supItems.reduce((s,x)=>(parseInt(x.amount)||0)*(parseInt(x.count)||1)+s,0);
      if(supItems.length>0&&supItems.some(x=>x.label||x.amount)){
        lines.push(`■備品　${supTotal.toLocaleString()}`);
        supItems.forEach(x=>{ if(x.label||x.amount){ const sc=parseInt(x.count)||1,sa=parseInt(x.amount)||0; lines.push(sc>1?`${x.label}　${sa}×${sc}＝${(sa*sc).toLocaleString()}`:`${x.label}　${sa}`); } });
      } else { lines.push(`■備品　0`); }
      lines.push(``);
      const ac=expense.accommodation||[], at=ac.reduce((s,a)=>s+(parseInt(a.amount)||0),0);
      lines.push(`■宿泊　${at.toLocaleString()}`);
      ac.forEach(a=>{ if(a.label) lines.push(`${a.label}　${a.amount}`); });
      lines.push(``);
      const bathTotalExp=(parseInt(expense.bath||0))*(parseInt(expense.bathCount)||1);
      const supTotalExp=(expense.suppliesItems||[]).reduce((s,x)=>(parseInt(x.amount)||0)*(parseInt(x.count)||1)+s,0);
      const grand=Math.round(wageTotal)+tt+bathTotalExp+supTotalExp+at;
      lines.push(`◆TOTAL`,`給与計＋交通費＋銭湯代＋備品＋宿泊`,`${Math.round(wageTotal).toLocaleString()}＋${tt.toLocaleString()}＋${bathTotalExp.toLocaleString()}＋${supTotalExp.toLocaleString()}＋${at.toLocaleString()}＝${grand.toLocaleString()}`);
      return lines.join("\n");
    }

    const TABS = ["記録","イベント","精算レポート","月次"];
    const IS = { background:"rgba(255,255,255,0.08)", border:"1px solid rgba(138,101,255,0.35)", borderRadius:8, padding:"8px 12px", color:"#fff", fontSize:14, boxSizing:"border-box", outline:"none", width:"100%" };

    // ─── WageBadge ────────────────────────────────────────────
    function WageBadge({ workMin, wage }) {
      const { total, normalHours, overHours } = calcWage(workMin, wage);
      if (!workMin) return null;
      return (
        <div style={{background:"linear-gradient(135deg,rgba(34,211,165,0.15),rgba(251,191,36,0.1))",border:"1px solid rgba(34,211,165,0.3)",borderRadius:10,padding:"10px 14px",marginTop:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontSize:11,color:"#9b8fff",marginBottom:2}}>本日の給与（概算）</div><div style={{fontSize:22,fontWeight:800,color:"#22d3a5"}}>{fmtYen(total)}</div></div>
          <div style={{fontSize:11,color:"#9b8fff",textAlign:"right",lineHeight:1.8}}><div>通常 {normalHours.toFixed(1)}h</div>{overHours>0&&<div style={{color:"#fbbf24"}}>残業 {overHours.toFixed(1)}h</div>}</div>
        </div>
      );
    }

    // ─── EditModal ────────────────────────────────────────────
    function EditModal({ dateStr, rec, eventName, onSave, onClose, onDelete, wage }) {
      const init = rec||{};
      const [ci, setCi] = useState(fmtTime(init.clockIn));
      const [co, setCo] = useState(fmtTime(init.clockOut));
      const [breaks, setBreaks] = useState((init.breaks||[]).map(b=>({start:fmtTime(b.start),end:fmtTime(b.end)})));
      const [note, setNote] = useState(init.note||"");
      const prev = { clockIn:ci?buildISO(dateStr,ci):null, clockOut:co?buildISO(dateStr,co):null, breaks:breaks.filter(b=>b.start).map(b=>({start:buildISO(dateStr,b.start),end:b.end?buildISO(dateStr,b.end):null})) };
      const pw = calcWork(prev); const pwage = calcWage(pw, wage);
      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.78)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
          <div style={{background:"linear-gradient(160deg,#1e1a3a,#2a2250)",border:"1px solid rgba(138,101,255,0.4)",borderRadius:20,padding:24,width:"100%",maxWidth:420,maxHeight:"88vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div><div style={{fontSize:16,fontWeight:800}}>{fmtDate(dateStr)} の編集</div>{eventName&&<div style={{fontSize:12,color:"#9b8fff",marginTop:2}}>📍 {eventName}</div>}</div>
              <button onClick={onClose} style={{background:"none",border:"none",color:"#9b8fff",fontSize:22,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
              {[["🟢 出勤",ci,setCi],["🔴 退勤",co,setCo]].map(([label,val,set])=>(
                <div key={label}><div style={{fontSize:11,color:"#9b8fff",marginBottom:5}}>{label}</div><input type="time" value={val} onChange={e=>set(e.target.value)} style={IS} /></div>
              ))}
            </div>
            <div style={{marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:11,color:"#9b8fff",letterSpacing:2}}>休憩</div>
                <button onClick={()=>setBreaks(p=>[...p,{start:"",end:""}])} style={{background:"rgba(251,191,36,0.2)",border:"1px solid rgba(251,191,36,0.4)",color:"#fbbf24",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer"}}>＋ 追加</button>
              </div>
              {breaks.map((b,i)=>(
                <div key={i} style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
                  <input type="time" value={b.start} onChange={e=>setBreaks(p=>p.map((x,j)=>j===i?{...x,start:e.target.value}:x))} style={{...IS,flex:1}} />
                  <span style={{color:"#9b8fff",fontSize:12}}>〜</span>
                  <input type="time" value={b.end} onChange={e=>setBreaks(p=>p.map((x,j)=>j===i?{...x,end:e.target.value}:x))} style={{...IS,flex:1}} />
                  <button onClick={()=>setBreaks(p=>p.filter((_,j)=>j!==i))} style={{background:"rgba(248,113,113,0.2)",border:"none",color:"#f87171",borderRadius:6,padding:"6px 8px",cursor:"pointer",fontSize:13}}>✕</button>
                </div>
              ))}
              {breaks.length===0&&<div style={{fontSize:12,color:"#5a5070"}}>休憩なし</div>}
            </div>
            {pw>0&&(
              <div style={{background:"rgba(34,211,165,0.08)",border:"1px solid rgba(34,211,165,0.25)",borderRadius:12,padding:"12px 14px",marginBottom:16}}>
                <div style={{fontSize:11,color:"#9b8fff",marginBottom:6}}>給与プレビュー</div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:20,fontWeight:800,color:"#22d3a5"}}>{fmtYen(pwage.total)}</div>
                  <div style={{fontSize:11,color:"#9b8fff",textAlign:"right",lineHeight:1.8}}><div>勤務 {fmtMin(pw)}</div>{pwage.overHours>0&&<div style={{color:"#fbbf24"}}>残業 {pwage.overHours.toFixed(1)}h</div>}</div>
                </div>
              </div>
            )}
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,color:"#9b8fff",marginBottom:5}}>メモ</div>
              <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2} placeholder="備考・メモ（任意）" style={{...IS,resize:"vertical",fontFamily:"inherit"}} />
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>onSave({clockIn:ci?buildISO(dateStr,ci):null,clockOut:co?buildISO(dateStr,co):null,breaks:breaks.filter(b=>b.start).map(b=>({start:buildISO(dateStr,b.start),end:b.end?buildISO(dateStr,b.end):null})),note})} style={{flex:1,background:"rgba(138,101,255,0.8)",border:"none",color:"#fff",borderRadius:12,padding:13,fontSize:14,fontWeight:700,cursor:"pointer"}}>保存</button>
              {rec&&<button onClick={onDelete} style={{background:"rgba(248,113,113,0.15)",border:"1px solid rgba(248,113,113,0.4)",color:"#f87171",borderRadius:12,padding:"13px 16px",fontSize:13,cursor:"pointer"}}>削除</button>}
            </div>
          </div>
        </div>
      );
    }

    // ─── WageModal ────────────────────────────────────────────
    function WageModal({ wage, onSave, onClose }) {
      const [bh, setBh] = useState(String(wage.baseHourly??1400));
      const [th, setTh] = useState(String(wage.thresholdHours??8));
      const [or, setOr] = useState(String(wage.overtimeRate??1.25));
      const ex=(parseFloat(th)||8)*(parseFloat(bh)||1400), exO=(parseFloat(bh)||1400)*(parseFloat(or)||1.25);
      return (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.78)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
          <div style={{background:"linear-gradient(160deg,#1e1a3a,#2a2250)",border:"1px solid rgba(34,211,165,0.35)",borderRadius:20,padding:24,width:"100%",maxWidth:380}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontSize:16,fontWeight:800}}>💰 時給設定</div>
              <button onClick={onClose} style={{background:"none",border:"none",color:"#9b8fff",fontSize:22,cursor:"pointer"}}>✕</button>
            </div>
            {[["基本時給（円）",bh,setBh,"例: 1400"],["通常時間の上限（時間）",th,setTh,"例: 8"],["残業の割増率",or,setOr,"例: 1.25"]].map(([label,val,set,ph])=>(
              <div key={label} style={{marginBottom:14}}><div style={{fontSize:11,color:"#9b8fff",marginBottom:5}}>{label}</div><input type="number" value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={IS} step="0.01" /></div>
            ))}

    // ─── PastDateSection ──────────────────────────────────────
    function PastDateSection({ data, wage, selectedEvent, todayStr, openEdit }) {
      const today = new Date(todayStr+"T00:00:00");
      const days = [];
      const endOfWeek = new Date(today);
      endOfWeek.setDate(endOfWeek.getDate() + (6 - today.getDay()));
      for (let i=34; i>=0; i--) {
        const d = new Date(endOfWeek);
        d.setDate(d.getDate() - i);
        days.push(localDateStr(d));
      }
      const [manualY, setManualY] = useState(String(today.getFullYear()));
      const [manualM, setManualM] = useState(pad(today.getMonth()+1));
      const [manualD, setManualD] = useState(pad(today.getDate()));
      const [selected, setSelected] = useState(todayStr);
      useEffect(()=>{ const d=new Date(selected+"T00:00:00"); setManualY(String(d.getFullYear())); setManualM(pad(d.getMonth()+1)); setManualD(pad(d.getDate())); },[selected]);
      function applyManual() { const s=`${manualY}-${manualM.padStart(2,"0")}-${manualD.padStart(2,"0")}`; if(/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s))) setSelected(s); }
      const recKey = selectedEvent?`${selectedEvent.id}_${selected}`:selected;
      const rec = data[recKey]||null;
      const wm = calcWork(rec);
      const weeks = []; for (let w=0;w<5;w++) weeks.push(days.slice(w*7,w*7+7));
      const DOW = ["日","月","火","水","木","金","土"];
      return (
        <div style={{background:"rgba(255,255,255,0.04)",borderRadius:18,padding:18,border:"1px solid rgba(255,255,255,0.08)"}}>
          <div style={{fontSize:11,color:"#9b8fff",letterSpacing:3,marginBottom:14}}>日付を選んで記録・編集</div>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:"#9b8fff",marginBottom:8}}>日付を直接入力</div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <input value={manualY} onChange={e=>setManualY(e.target.value)} onBlur={applyManual} maxLength={4} style={{...IS,width:64,textAlign:"center",padding:"8px 6px"}} />
              <span style={{color:"#9b8fff"}}>年</span>
              <input value={manualM} onChange={e=>setManualM(e.target.value)} onBlur={applyManual} maxLength={2} style={{...IS,width:44,textAlign:"center",padding:"8px 4px"}} />
              <span style={{color:"#9b8fff"}}>月</span>
              <input value={manualD} onChange={e=>setManualD(e.target.value)} onBlur={applyManual} maxLength={2} style={{...IS,width:44,textAlign:"center",padding:"8px 4px"}} />
              <span style={{color:"#9b8fff"}}>日</span>
              <button onClick={applyManual} style={{background:"rgba(138,101,255,0.5)",border:"none",color:"#fff",borderRadius:8,padding:"8px 14px",fontSize:13,cursor:"pointer",fontWeight:700}}>→</button>
            </div>
          </div>
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,color:"#9b8fff",marginBottom:8}}>カレンダーから選ぶ（直近5週）</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:4}}>
              {DOW.map((d,i)=><div key={d} style={{textAlign:"center",fontSize:10,color:i===0?"#f87171":i===6?"#60a5fa":"#9b8fff",fontWeight:700,padding:"2px 0"}}>{d}</div>)}
            </div>
            {weeks.map((week,wi)=>(
              <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:3}}>
                {week.map(ds=>{
                  const rk=selectedEvent?`${selectedEvent.id}_${ds}`:ds;
                  const hasRec=!!(data[rk]?.clockIn), isToday=ds===todayStr, isSel=ds===selected;
                  const dow=new Date(ds+"T00:00:00").getDay();
                  return (
                    <button key={ds} onClick={()=>setSelected(ds)} style={{padding:"6px 2px",borderRadius:8,border:"none",cursor:"pointer",background:isSel?"rgba(138,101,255,0.85)":hasRec?"rgba(34,211,165,0.2)":"rgba(255,255,255,0.05)",color:isSel?"#fff":isToday?"#fbbf24":dow===0?"#f87171":dow===6?"#60a5fa":"#d0c8ff",fontSize:12,fontWeight:isToday||isSel?700:400,outline:isToday&&!isSel?"1px solid rgba(251,191,36,0.5)":"none",position:"relative"}}>
                      {new Date(ds+"T00:00:00").getDate()}
                      {hasRec&&!isSel&&<div style={{width:4,height:4,borderRadius:"50%",background:"#22d3a5",position:"absolute",bottom:2,left:"50%",transform:"translateX(-50%)"}} />}
                    </button>
                  );
                })}
              </div>
            ))}
          </div>
          <div style={{background:"rgba(255,255,255,0.06)",borderRadius:14,padding:"14px 16px",border:rec?"1px solid rgba(34,211,165,0.3)":"1px solid rgba(138,101,255,0.25)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:rec?10:0}}>
              <div><div style={{fontSize:13,fontWeight:700}}>{fmtDate(selected)}</div>{!rec&&<div style={{fontSize:12,color:"#5a5070",marginTop:2}}>記録なし</div>}</div>
              <button onClick={()=>openEdit(selected,selectedEvent?.id)} style={{background:rec?"rgba(138,101,255,0.4)":"rgba(138,101,255,0.7)",border:"none",color:"#fff",borderRadius:10,padding:"9px 18px",fontSize:13,fontWeight:700,cursor:"pointer"}}>{rec?"✏️ 編集":"＋ 記録する"}</button>
            </div>
            {rec&&<div style={{display:"flex",gap:12,fontSize:13,flexWrap:"wrap",alignItems:"center"}}><span>🟢 {fmtTime(rec.clockIn)}</span><span>🔴 {fmtTime(rec.clockOut)}</span><span style={{color:"#c4b5ff"}}>計 {fmtMin(wm)}</span>{wm>0&&<span style={{color:"#22d3a5",fontWeight:700}}>{fmtYen(calcWage(wm,wage).total)}</span>}</div>}
          </div>
        </div>
      );
    }

    function StampBtn({ label, emoji, color, disabled, onClick }) {
      return (
        <button onClick={onClick} disabled={disabled} style={{background:disabled?"rgba(255,255,255,0.04)":`${color}22`,border:`1px solid ${disabled?"rgba(255,255,255,0.08)":color+"55"}`,borderRadius:12,padding:"16px 10px",cursor:disabled?"not-allowed":"pointer",color:disabled?"#444":color,textAlign:"center",transition:"all .2s",opacity:disabled?0.4:1}}>
          <div style={{fontSize:22,marginBottom:3}}>{emoji}</div>
          <div style={{fontSize:13,fontWeight:700}}>{label}</div>
        </button>
      );
    }

    // ─── Main App ─────────────────────────────────────────────
    function App() {
      const [tab,  setTab]  = useState(0);
      const [data, setData] = useState({});
      const [events, setEvents] = useState([]);
      const [wage,   setWage]   = useState({baseHourly:1400,thresholdHours:8,overtimeRate:1.25});
      const [reportData, setReportData] = useState({});
      const [loaded, setLoaded] = useState(false);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [now, setNow] = useState(new Date());
      const [editModal,    setEditModal]    = useState(null);
      const [showWageModal,setShowWageModal]= useState(false);
      const [showNewEv,    setShowNewEv]    = useState(false);
      const [neName,setNeName]=useState(""); const [neStore,setNeStore]=useState(""); const [neStart,setNeStart]=useState(""); const [neEnd,setNeEnd]=useState("");
      const [reportMonth, setReportMonth] = useState(()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;});
      const [showImport, setShowImport]   = useState(false);
      const [exportCopied, setExportCopied] = useState(false);
      const [importText, setImportText]   = useState("");
      const [importMsg,  setImportMsg]    = useState("");

      useEffect(()=>{
        (async()=>{
          const [d,e,w,r] = await Promise.all([storageLoad(D_KEY,{}),storageLoad(E_KEY,[]),storageLoad(W_KEY,{baseHourly:1400,thresholdHours:8,overtimeRate:1.25}),storageLoad(R_KEY,{})]);
          setData(sanitizeData(d)); setEvents(Array.isArray(e)?e:[]); setWage(w||{baseHourly:1400,thresholdHours:8,overtimeRate:1.25}); setReportData(r||{}); setLoaded(true);
          document.getElementById("loading").style.display = "none";
        })();
      },[]);
      useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
      useEffect(()=>{if(loaded) storageSave(D_KEY,data);},[data,loaded]);
      useEffect(()=>{if(loaded) storageSave(E_KEY,events);},[events,loaded]);
      useEffect(()=>{if(loaded) storageSave(W_KEY,wage);},[wage,loaded]);
      useEffect(()=>{if(loaded) storageSave(R_KEY,reportData);},[reportData,loaded]);

      const todayStr = localDateStr(now);

      async function doExport() {
        const json = JSON.stringify({ data, events, wage, reportData, exportedAt: new Date().toISOString() }, null, 2);
        try { await navigator.clipboard.writeText(json); setExportCopied(true); setTimeout(()=>setExportCopied(false), 3000); } catch {}
      }

      function doImport() {
        try {
          const parsed = JSON.parse(importText);
          if (parsed.data)       setData(sanitizeData(parsed.data));
          if (parsed.events)     setEvents(Array.isArray(parsed.events)?parsed.events:[]);
          if (parsed.wage)       setWage(parsed.wage);
          if (parsed.reportData) setReportData(parsed.reportData);
          setImportMsg("✅ インポート完了！データが復元されました。");
          setImportText("");
          setTimeout(()=>{setImportMsg("");setShowImport(false);},2000);
        } catch { setImportMsg("❌ JSONの形式が正しくありません"); }
      }

      function stamp(type) {
        const ts=new Date().toISOString(); const key=selectedEvent?`${selectedEvent.id}_${todayStr}`:todayStr;
        setData(prev=>{const rec={...(prev[key]||{})};if(type==="in")rec.clockIn=ts;if(type==="out")rec.clockOut=ts;if(type==="breakStart")rec.breaks=[...(rec.breaks||[]),{start:ts}];if(type==="breakEnd"){const bs=[...(rec.breaks||[])];const last=bs[bs.length-1];if(last&&!last.end)bs[bs.length-1]={...last,end:ts};rec.breaks=bs;}return{...prev,[key]:rec};});
      }
      function openEdit(dateStr,eventId){setEditModal({dateStr,eventId:eventId||null});}
      function handleSaveEdit(newRec){const key=editModal.eventId?`${editModal.eventId}_${editModal.dateStr}`:editModal.dateStr;setData(prev=>({...prev,[key]:newRec}));setEditModal(null);}
      function handleDeleteEdit(){const key=editModal.eventId?`${editModal.eventId}_${editModal.dateStr}`:editModal.dateStr;setData(prev=>{const n={...prev};delete n[key];return n;});setEditModal(null);}

      const todayKey=selectedEvent?`${selectedEvent.id}_${todayStr}`:todayStr;
      const todayRec=data[todayKey]||{};
      const isOnBreak=(todayRec.breaks||[]).length>0&&todayRec.breaks[todayRec.breaks.length-1].start&&!todayRec.breaks[todayRec.breaks.length-1].end;
      const todayWork=calcWork(todayRec);
      const todayBreak=(todayRec.breaks||[]).reduce((s,b)=>b.start&&b.end?s+(new Date(b.end)-new Date(b.start))/60000:s,0);

      function addEvent(){if(!neName)return;const ev={id:Date.now().toString(),name:neName,store:neStore,start:neStart,end:neEnd};setEvents(p=>[...p,ev]);setNeName("");setNeStore("");setNeStart("");setNeEnd("");setShowNewEv(false);setSelectedEvent(ev);setTab(0);}

      const reportAll=Object.entries(data).filter(([k])=>{const dp=k.includes("_")?k.split("_")[1]:k;return dp.startsWith(reportMonth);});
      const totalWork=reportAll.reduce((s,[,r])=>s+calcWork(r),0);
      const workDays=reportAll.filter(([,r])=>r?.clockIn&&r?.clockOut).length;
      const totalWage=reportAll.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).total,0);
      const totalOverMin=reportAll.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).overHours*60,0);
      const modalRec=editModal?(data[editModal.eventId?`${editModal.eventId}_${editModal.dateStr}`:editModal.dateStr]||null):null;
      const modalEventName=editModal?.eventId?(events.find(e=>e.id===editModal.eventId)?.name):null;

      if (!loaded) return null;

      return (
        <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)",fontFamily:"'Noto Sans JP','Hiragino Kaku Gothic Pro',sans-serif",color:"#f0eeff",display:"flex",flexDirection:"column",alignItems:"center"}}>
          <div style={{width:"100%",maxWidth:480,padding:"24px 24px 0",boxSizing:"border-box"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:10,letterSpacing:4,color:"#a89fff",textTransform:"uppercase",marginBottom:3}}>Attendance Manager</div>
                <div style={{fontSize:24,fontWeight:800,letterSpacing:-1,marginBottom:2}}>出退勤管理</div>
                <div style={{fontSize:12,color:"#9b8fff",marginBottom:16}}>{fmtDate(todayStr)}　{now.toLocaleTimeString("ja-JP")}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
                <button onClick={()=>setShowWageModal(true)} style={{background:"rgba(34,211,165,0.15)",border:"1px solid rgba(34,211,165,0.35)",color:"#22d3a5",borderRadius:10,padding:"7px 11px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>💰 時給設定</button>
                <button onClick={()=>setShowImport(v=>!v)} style={{background:"rgba(251,191,36,0.15)",border:"1px solid rgba(251,191,36,0.35)",color:"#fbbf24",borderRadius:10,padding:"7px 11px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>📥 データ移行</button>
                <button onClick={handleLogout} style={{background:"rgba(248,113,113,0.12)",border:"1px solid rgba(248,113,113,0.35)",color:"#f87171",borderRadius:10,padding:"7px 11px",fontSize:11,cursor:"pointer",whiteSpace:"nowrap"}}>🚪 ログアウト</button>
              </div>
            </div>
            <div style={{display:"flex",gap:3,background:"rgba(255,255,255,0.07)",borderRadius:12,padding:3,marginBottom:20}}>
              {TABS.map((t,i)=><button key={i} onClick={()=>setTab(i)} style={{flex:1,padding:"7px 0",borderRadius:8,border:"none",cursor:"pointer",background:tab===i?"rgba(138,101,255,0.85)":"transparent",color:tab===i?"#fff":"#9b8fff",fontWeight:tab===i?700:400,fontSize:11,transition:"all .2s"}}>{t}</button>)}
            </div>
          </div>

          <div style={{width:"100%",maxWidth:480,padding:"0 24px 48px",boxSizing:"border-box"}}>
            {showImport&&(
              <div style={{background:"rgba(251,191,36,0.08)",border:"1px solid rgba(251,191,36,0.35)",borderRadius:16,padding:18,marginBottom:16}}>
                <div style={{fontSize:13,fontWeight:700,color:"#fbbf24",marginBottom:14}}>📦 データ移行</div>
                <div style={{background:"rgba(255,255,255,0.05)",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#c4b5ff",marginBottom:6}}>📤 このアプリからエクスポート</div>
                  <div style={{fontSize:11,color:"#9b8fff",marginBottom:10,lineHeight:1.7}}>新しいアプリに移行するときにコピーしてください。</div>
                  <button onClick={doExport} style={{width:"100%",background:exportCopied?"rgba(34,211,165,0.5)":"rgba(138,101,255,0.5)",border:"none",color:"#fff",borderRadius:10,padding:11,fontSize:13,fontWeight:700,cursor:"pointer"}}>{exportCopied?"✅ コピーしました！":"📋 JSONをコピー"}</button>
                </div>
                <div style={{background:"rgba(255,255,255,0.05)",borderRadius:12,padding:"12px 14px"}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#c4b5ff",marginBottom:6}}>📥 インポート</div>
                  <div style={{fontSize:11,color:"#9b8fff",marginBottom:10,lineHeight:1.7}}>コピーしたJSONを貼り付けてください。</div>
                  <textarea value={importText} onChange={e=>setImportText(e.target.value)} rows={3} placeholder='{"data":{...},"events":[...]} をここに貼り付け'
                    style={{...IS,resize:"vertical",fontFamily:"monospace",fontSize:12,marginBottom:8}} />
                  {importMsg&&<div style={{fontSize:12,marginBottom:8,color:importMsg.startsWith("✅")?"#22d3a5":"#f87171"}}>{importMsg}</div>}
                  <button onClick={doImport} style={{width:"100%",background:"rgba(251,191,36,0.5)",border:"none",color:"#fff",borderRadius:10,padding:11,fontSize:13,fontWeight:700,cursor:"pointer"}}>インポート実行</button>
                </div>
              </div>
            )}

            {tab===0&&(
              <div>
                <div style={{background:"rgba(255,255,255,0.06)",borderRadius:16,padding:"12px 16px",marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:18}}>📍</span>
                  <div style={{flex:1}}><div style={{fontSize:10,color:"#9b8fff",letterSpacing:2}}>現在のイベント</div><div style={{fontSize:14,fontWeight:700}}>{selectedEvent?`${selectedEvent.name}｜${selectedEvent.store}`:"（未選択）"}</div></div>
                  <button onClick={()=>setTab(1)} style={{background:"rgba(138,101,255,0.3)",border:"1px solid rgba(138,101,255,0.5)",color:"#c4b5ff",borderRadius:8,padding:"6px 12px",fontSize:12,cursor:"pointer"}}>変更</button>
                </div>
                <div style={{background:"rgba(255,255,255,0.05)",borderRadius:18,padding:18,marginBottom:14,border:"1px solid rgba(138,101,255,0.18)"}}>
                  <div style={{fontSize:11,color:"#9b8fff",letterSpacing:3,marginBottom:12}}>TODAY　今日の打刻</div>
                  <div style={{display:"flex",justifyContent:"space-around",marginBottom:10}}>
                    {[["出勤",todayRec.clockIn,"#22d3a5"],["退勤",todayRec.clockOut,"#f87171"]].map(([lbl,iso,col])=>(
                      <div key={lbl} style={{textAlign:"center"}}><div style={{fontSize:10,color:"#9b8fff",marginBottom:3}}>{lbl}</div><div style={{fontSize:24,fontWeight:800,color:iso?col:"#444"}}>{fmtTime(iso)}</div></div>
                    ))}
                  </div>
                  <div style={{display:"flex",justifyContent:"space-around",fontSize:12,color:"#c4b5ff",marginBottom:12}}><div>勤務 {fmtMin(todayWork)}</div><div>休憩 {fmtMin(todayBreak)}</div></div>
                  <WageBadge workMin={todayWork} wage={wage} />
                  <div style={{marginTop:12,display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                    <StampBtn label="出勤" emoji="🟢" color="#22d3a5" disabled={!!todayRec.clockIn} onClick={()=>stamp("in")} />
                    <StampBtn label="退勤" emoji="🔴" color="#f87171" disabled={!todayRec.clockIn||!!todayRec.clockOut} onClick={()=>stamp("out")} />
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <StampBtn label={isOnBreak?"休憩終了":"休憩開始"} emoji={isOnBreak?"▶️":"⏸️"} color="#fbbf24" disabled={!todayRec.clockIn||!!todayRec.clockOut} onClick={()=>stamp(isOnBreak?"breakEnd":"breakStart")} />
                    <button onClick={()=>openEdit(todayStr,selectedEvent?.id)} style={{background:"rgba(138,101,255,0.15)",border:"1px solid rgba(138,101,255,0.35)",color:"#c4b5ff",borderRadius:12,padding:"14px 12px",cursor:"pointer",fontSize:13,fontWeight:600}}>✏️ 手動編集</button>
                  </div>
                </div>
                <PastDateSection data={data} wage={wage} selectedEvent={selectedEvent} todayStr={todayStr} openEdit={openEdit} />
              </div>
            )}

            {tab===1&&(
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div style={{fontSize:15,fontWeight:700}}>イベント一覧</div>
                  <button onClick={()=>setShowNewEv(v=>!v)} style={{background:"rgba(138,101,255,0.7)",border:"none",color:"#fff",borderRadius:10,padding:"8px 16px",fontSize:13,cursor:"pointer",fontWeight:700}}>＋ 新規</button>
                </div>
                {showNewEv&&(
                  <div style={{background:"rgba(255,255,255,0.07)",borderRadius:16,padding:18,marginBottom:14,border:"1px solid rgba(138,101,255,0.3)"}}>
                    <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>新規イベント</div>
                    {[["イベント名","text",neName,setNeName,"例：春の外商フェア"],["百貨店・場所","text",neStore,setNeStore,"例：新宿三越"],["開始日","date",neStart,setNeStart,""],["終了日","date",neEnd,setNeEnd,""]].map(([label,type,val,set,ph])=>(
                      <div key={label} style={{marginBottom:10}}><div style={{fontSize:11,color:"#9b8fff",marginBottom:4}}>{label}</div><input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph} style={IS} /></div>
                    ))}
                    <button onClick={addEvent} style={{width:"100%",background:"rgba(138,101,255,0.8)",border:"none",color:"#fff",borderRadius:10,padding:12,fontSize:14,fontWeight:700,cursor:"pointer",marginTop:4}}>保存して選択</button>
                  </div>
                )}
                {events.length===0&&<div style={{textAlign:"center",color:"#9b8fff",fontSize:14,padding:40}}>イベントがまだありません</div>}
                {[...events].sort((a,b)=>{ const as=a.start||''; const bs=b.start||''; return bs>as?1:bs<as?-1:0; }).map(ev=>{
                  const isSelected=selectedEvent?.id===ev.id;
                  const evRecs=Object.entries(data).filter(([k])=>k.startsWith(ev.id+"_"));
                  const evTotal=evRecs.reduce((s,[,r])=>s+calcWork(r),0);
                  const evDays=evRecs.filter(([,r])=>r?.clockIn&&r?.clockOut).length;
                  const evWage=evRecs.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).total,0);
                  return (
                    <div key={ev.id} onClick={()=>{setSelectedEvent(ev);setTab(0);}} style={{background:isSelected?"rgba(138,101,255,0.25)":"rgba(255,255,255,0.05)",border:isSelected?"1px solid rgba(138,101,255,0.6)":"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:"16px 18px",marginBottom:12,cursor:"pointer",transition:"all .2s"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div><div style={{fontSize:12,color:"#9b8fff",marginTop:2}}>📍 {ev.store}</div><div style={{fontWeight:700,fontSize:15}}>{ev.name}</div>{ev.start&&<div style={{fontSize:11,color:"#7b6fff",marginTop:2}}>{fmtJapanDate(ev.start,ev.end)}</div>}</div>
                        <div style={{textAlign:"right"}}><div style={{fontSize:16,fontWeight:800,color:"#22d3a5"}}>{fmtYen(evWage)}</div><div style={{fontSize:12,color:"#c4b5ff"}}>{fmtMin(evTotal)}</div><div style={{fontSize:11,color:"#9b8fff"}}>{evDays}日</div></div>
                      </div>
                      {isSelected&&<div style={{marginTop:8,fontSize:11,color:"#a89fff",background:"rgba(138,101,255,0.2)",borderRadius:6,padding:"4px 10px",display:"inline-block"}}>✓ 選択中</div>}
                    </div>
                  );
                })}
              </div>
            )}

            {tab===2&&<ExpenseReportTab events={events} data={data} wage={wage} reportData={reportData} setReportData={setReportData} />}

            {tab===3&&(
              <div>
                <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18,flexWrap:"wrap"}}>
                  <input type="month" value={reportMonth} onChange={e=>setReportMonth(e.target.value)} style={{...IS,width:"auto"}} />
                  <div style={{fontSize:13,color:"#9b8fff"}}>の集計</div>
                  <button onClick={async()=>{
                    const lines=[`${reportMonth} 月次集計`,``,`総給与　${fmtYen(totalWage)}`,`出勤日数　${workDays}日`,`総勤務時間　${fmtMin(totalWork)}`,`残業時間　${fmtMin(totalOverMin)}`,``,`日別明細`];
                    reportAll.sort(([a],[b])=>a>b?1:-1).forEach(([key,rec])=>{
                      const dp=key.includes("_")?key.split("_")[1]:key;
                      const evId=key.includes("_")?key.split("_")[0]:null;
                      const ev=events.find(e=>e.id===evId);
                      const wm=calcWork(rec);
                      lines.push(`${fmtDate(dp)}${ev?` ${ev.name}`:""}　${fmtTime(rec?.clockIn)}〜${fmtTime(rec?.clockOut)}　${fmtMin(wm)}　${fmtYen(calcWage(wm,wage).total)}`);
                    });
                    try{await navigator.clipboard.writeText(lines.join("\n"));}catch{}
                  }} style={{background:"rgba(138,101,255,0.4)",border:"none",color:"#fff",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>📋 コピー</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
                  {[["総給与（概算）",fmtYen(totalWage),"💰","#22d3a5"],["出勤日数",`${workDays}日`,"📅","#c4b5ff"],["総勤務時間",fmtMin(totalWork),"⏱️","#c4b5ff"],["残業時間",fmtMin(totalOverMin),"⚡","#fbbf24"]].map(([label,val,emoji,col])=>(
                    <div key={label} style={{background:"rgba(138,101,255,0.15)",borderRadius:14,padding:"16px 18px",border:"1px solid rgba(138,101,255,0.25)"}}>
                      <div style={{fontSize:20,marginBottom:4}}>{emoji}</div><div style={{fontSize:20,fontWeight:800,color:col}}>{val}</div><div style={{fontSize:11,color:"#9b8fff",marginTop:2}}>{label}</div>
                    </div>
                  ))}
                </div>
                <div style={{background:"rgba(34,211,165,0.07)",border:"1px solid rgba(34,211,165,0.2)",borderRadius:14,padding:"14px 18px",marginBottom:14,fontSize:13}}>
                  <div style={{fontSize:11,color:"#9b8fff",marginBottom:8,letterSpacing:2}}>給与内訳</div>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span>通常時給 ¥{wage.baseHourly.toLocaleString()}</span><span style={{color:"#22d3a5"}}>{fmtYen(reportAll.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).normal,0))}</span></div>
                  <div style={{display:"flex",justifyContent:"space-between"}}><span>残業割増（×{wage.overtimeRate}）</span><span style={{color:"#fbbf24"}}>{fmtYen(reportAll.reduce((s,[,r])=>s+calcWage(calcWork(r),wage).overtime,0))}</span></div>
                </div>
                <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"16px 18px"}}>
                  <div style={{fontSize:11,color:"#9b8fff",letterSpacing:2,marginBottom:12}}>日別明細</div>
                  {reportAll.length===0&&<div style={{textAlign:"center",color:"#9b8fff",padding:20,fontSize:13}}>記録がありません</div>}
                  {reportAll.sort(([a],[b])=>a>b?1:-1).map(([key,rec])=>{
                    const dp=key.includes("_")?key.split("_")[1]:key;
                    const evId=key.includes("_")?key.split("_")[0]:null;
                    const ev=events.find(e=>e.id===evId);
                    const wm=calcWork(rec); const w=calcWage(wm,wage);
                    return (
                      <div key={key} style={{padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.05)",fontSize:13}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                          <div><div style={{fontWeight:600}}>{fmtDate(dp)}</div>{ev&&<div style={{fontSize:11,color:"#9b8fff"}}>{ev.name}</div>}{rec?.note&&<div style={{fontSize:11,color:"#7060a0"}}>📝 {rec.note}</div>}</div>
                          <div style={{textAlign:"right"}}>
                            <div>{fmtTime(rec?.clockIn)}〜{fmtTime(rec?.clockOut)}</div>
                            <div style={{fontSize:11,color:"#c4b5ff"}}>{fmtMin(wm)}</div>
                            <div style={{fontSize:13,fontWeight:700,color:"#22d3a5"}}>{fmtYen(w.total)}</div>
                            {w.overHours>0&&<div style={{fontSize:10,color:"#fbbf24"}}>残業 {w.overHours.toFixed(1)}h</div>}
                            <button onClick={()=>openEdit(dp,evId)} style={{background:"none",border:"none",color:"#7060a0",fontSize:11,cursor:"pointer",padding:0}}>✏️ 編集</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          {editModal&&<EditModal dateStr={editModal.dateStr} rec={modalRec} eventName={modalEventName} wage={wage} onSave={handleSaveEdit} onClose={()=>setEditModal(null)} onDelete={handleDeleteEdit} />}
          {showWageModal&&<WageModal wage={wage} onSave={w=>{setWage(w);setShowWageModal(false);}} onClose={()=>setShowWageModal(false)} />}
        </div>
      );
    }

    function handleLogout() {
      fetch('/api/logout', { method: 'POST' }).then(() => window.location.reload());
    }

    function initApp() {
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    }

    function showLoginScreen() {
      document.getElementById('loading').style.display = 'none';
      const loginScreen = document.getElementById('login-screen');
      loginScreen.style.display = 'flex';

      async function doLogin() {
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');
        loginBtn.disabled = true;
        loginBtn.textContent = 'ログイン中...';
        loginError.style.display = 'none';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              id: document.getElementById('login-id').value.trim(),
              password: document.getElementById('login-password').value,
              rememberMe: document.getElementById('login-remember').checked
            })
          });
          const data = await res.json();
          if (res.ok) {
            loginScreen.style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
            initApp();
          } else {
            loginError.textContent = data.error || 'ログインに失敗しました';
            loginError.style.display = 'block';
          }
        } catch {
          document.getElementById('login-error').textContent = 'ネットワークエラーが発生しました';
          document.getElementById('login-error').style.display = 'block';
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = 'ログイン';
        }
      }

      document.getElementById('login-btn').addEventListener('click', doLogin);
      document.getElementById('login-password').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
      document.getElementById('login-id').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('login-password').focus(); });
    }

    (async function() {
      try {
        const res = await fetch('/api/auth-check');
        const { authenticated } = await res.json();
        if (authenticated) { initApp(); return; }
      } catch {}
      showLoginScreen();
    })();
  </script>
</body>
</html>
